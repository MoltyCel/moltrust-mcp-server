name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Pinned on purpose: an unpinned `pip install ruff` tracks every release,
      # so a new lint rule turns an unrelated PR red. That happened on #14 —
      # ruff 0.16.0 raised I001 on a file the PR never touched. Bump this line
      # deliberately, in its own PR, with the fixes it demands.
      - run: pip install ruff==0.16.0
      - run: ruff check src/
      - run: ruff format --check src/

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -e .
      # Pinned for the same reason as ruff above: pyright ships new inference
      # every release and fails the build on findings that were fine yesterday.
      - run: pip install pyright==1.1.411
      - run: pyright src/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install pytest pytest-asyncio
      - run: pytest tests/ -v
