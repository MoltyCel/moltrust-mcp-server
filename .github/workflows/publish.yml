name: Publish to PyPI and the MCP registry

on:
  push:
    tags:
      - "v*"
  # The registry rejected v1.2.3 on a rule that had tightened since the last
  # release — descriptions are capped at 100 characters now, ours was 214. PyPI
  # had the wheel by then, so the only way back in sync was re-running the
  # registry half alone. A tag is not re-runnable; this is.
  workflow_dispatch:

permissions:
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e .
      - run: pip install pytest pytest-asyncio
      - run: pytest tests/ -v

  publish:
    needs: test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A re-run after a later job failed should not die on the upload it
          # already completed.
          skip-existing: true

  mcp-registry:
    # The registry entry sat at 0.7.0 while PyPI was at 1.2.2 — five versions
    # and four months — because nothing ever published it. A release that
    # updates one index and not the other is how that happens, so this runs off
    # the same tag.
    needs: [test, publish]
    if: always() && needs.test.result == 'success' && needs.publish.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC, so no device flow and no stored secret
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fail if server.json disagrees with the package
        # Two version numbers in one repo drift silently. Catching it here
        # costs a second; catching it in the registry costs a release.
        # tests/test_version_consistency.py catches it earlier still, on the
        # pull request — this stays as the last line before the record goes out.
        run: |
          pkg=$(grep -m1 '^version' pyproject.toml | sed 's/.*"\(.*\)".*/\1/')
          srv=$(python3 -c "import json;print(json.load(open('server.json'))['version'])")
          echo "pyproject=$pkg server.json=$srv ref=$GITHUB_REF_NAME"
          [ "$pkg" = "$srv" ] || { echo "::error::server.json $srv != pyproject $pkg"; exit 1; }
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            [ "$pkg" = "$tag" ] || { echo "::error::tag $tag != pyproject $pkg"; exit 1; }
          fi
          echo "PKG_VERSION=$pkg" >> "$GITHUB_ENV"

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          sudo mv mcp-publisher /usr/local/bin/

      - name: Validate the record before sending it
        run: mcp-publisher validate

      - name: Publish
        run: |
          mcp-publisher login github-oidc
          mcp-publisher publish

      - name: Confirm the registry actually took it
        # A publish that reports success and leaves the index unchanged is the
        # failure mode worth catching, so the version is read back.
        run: |
          sleep 10
          got=$(curl -fsS "https://registry.modelcontextprotocol.io/v0/servers?search=moltrust-mcp-server" \
                | python3 -c "import json,sys;v=[s['server']['version'] for s in json.load(sys.stdin)['servers']];print(max(v) if v else '')")
          echo "registry now reports: $got"
          [ "$got" = "$PKG_VERSION" ] || { echo "::error::registry shows $got, expected $PKG_VERSION"; exit 1; }
